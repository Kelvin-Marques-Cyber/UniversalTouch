name: Test, build, and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Bash uses fail-fast semantics on every native command, including Windows jobs.
defaults:
  run:
    shell: bash

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/requirements-build.txt
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk libglib2.0-0 libx11-6 build-essential linux-libc-dev
      - name: Verify and fetch pinned model assets
        run: python scripts/fetch_models.py
      - name: Install pinned runtime and build dependencies
        run: |
          python -m pip install -r packaging/requirements-build.txt
          python -m pip install --no-build-isolation .
      - name: Unit and release integrity tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s scripts/tests -v
          python scripts/fetch_models.py --check
          python -m universal_touch --self-test
          python scripts/release_version.py

  desktop:
    name: Native ${{ matrix.os }} portable build
    needs: python-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/requirements-build.txt
      - name: Linux build dependencies (glibc 2.35 baseline)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk libglib2.0-0 libx11-6 build-essential linux-libc-dev
      - name: Install and build native desktop bundle
        run: |
          python scripts/fetch_models.py
          python -m pip install -r packaging/requirements-build.txt
          python -m pip install --no-build-isolation .
          python scripts/build_desktop.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.os }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android preview APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Gesture and unit tests, Android lint, and preview APK
        working-directory: android
        run: ./gradlew --no-daemon :app:check :app:assembleRelease
      - name: Stage preview APK
        shell: bash
        run: |
          version="$(python scripts/release_version.py)"
          mkdir -p dist/releases
          cp android/app/build/outputs/apk/release/app-release.apk "dist/releases/UniversalTouch-v${version}-android-preview.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-preview
          path: dist/releases/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-tests, desktop, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*'
          path: dist/releases
          merge-multiple: true
      - name: Source archive and SHA-256 manifest
        shell: bash
        run: |
          version="$(python scripts/release_version.py)"
          python scripts/release_artifacts.py source "$version"
          python scripts/release_artifacts.py checksums dist/releases
          (cd dist/releases && sha256sum -c SHA256SUMS.txt)
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(python scripts/release_version.py)"
          release_args=(--verify-tag --title "UniversalTouch v${version}" --notes-file packaging/RELEASE-NOTES.md)
          if [[ "$version" == 0.* ]]; then release_args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${release_args[@]}" dist/releases/*
